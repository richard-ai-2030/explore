apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bff-marketing
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - explore
  selector:
    matchLabels:
      app: bff-marketing
      monitoring: enabled
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
---
