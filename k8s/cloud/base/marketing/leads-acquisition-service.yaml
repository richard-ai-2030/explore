apiVersion: apps/v1
kind: Deployment
metadata:
  name: leads-acquisition-service
  namespace: explore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leads-acquisition-service
  template:
    metadata:
      labels:
        app: leads-acquisition-service
        monitoring: enabled
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '7101'
    spec:
      containers:
      - name: leads-acquisition-service
        image: leads-acquisition-service:version3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7101
        env:
        - name: PORT
          value: '7101'
        - name: POSTGRES_HOST
          value: 172.19.0.5
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: leads_acquisition_service
        - name: KAFKA_ENABLED
          value: 'true'
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: host.docker.internal:9092
        - name: KAFKA_EVENTS_TOPIC
          value: explore.events
---
apiVersion: v1
kind: Service
metadata:
  name: leads-acquisition-service
  namespace: explore
  labels:
    app: leads-acquisition-service
    monitoring: enabled
spec:
  selector:
    app: leads-acquisition-service
  ports:
  - name: http
    port: 7101
    targetPort: 7101
