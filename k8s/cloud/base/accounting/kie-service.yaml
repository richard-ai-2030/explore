apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-service
  namespace: explore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kie-service
  template:
    metadata:
      labels:
        app: kie-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "7003"
    spec:
      containers:
        - name: kie-service
          image: kie-service:version3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7003
          env:
            - name: REDIS_URL
              value: "redis://172.19.0.6:6379/0"
            - name: REDIS_PREFIX
              value: "kie-service"
            - name: DEFAULT_CACHE_TTL_SECONDS
              value: "600"
            - name: PORT
              value: "7003"
---
apiVersion: v1
kind: Service
metadata:
  name: kie-service
  namespace: explore
spec:
  selector:
    app: kie-service
  ports:
    - name: http
      port: 7003
      targetPort: 7003
