apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-service
  namespace: explore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-service
  template:
    metadata:
      labels:
        app: cost-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "7133"
    spec:
      containers:
        - name: cost-service
          image: cost-service:version3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7133
          env:
            - name: REDIS_URL
              value: "redis://172.19.0.6:6379/0"
            - name: REDIS_PREFIX
              value: "cost-service"
            - name: DEFAULT_CACHE_TTL_SECONDS
              value: "600"
            - name: PORT
              value: "7133"
            - name: POSTGRES_HOST
              value: "172.19.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "cost_service"
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "172.19.0.1:9092"
            - name: KAFKA_EVENTS_TOPIC
              value: "explore.events"
---
apiVersion: v1
kind: Service
metadata:
  name: cost-service
  namespace: explore
spec:
  selector:
    app: cost-service
  ports:
    - name: http
      port: 7133
      targetPort: 7133
