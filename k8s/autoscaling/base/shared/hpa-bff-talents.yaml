apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-talents
  namespace: explore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-talents
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
